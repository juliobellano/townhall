name: Deploy tour to GitHub Pages

on:
  push:
    branches: [main]
    paths: [src/components/product-tour.tsx, src/components/ui/**, src/app/globals.css, scripts/build-pages.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out
      - id: deployment
        uses: actions/deploy-pages@v4
